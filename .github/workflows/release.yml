name: Release

# Push a tag such as v0.1.0 to build the macOS app and attach it to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:mac
      - run: ditto -c -k --keepParent release/Keytune-darwin-arm64/Keytune.app "Keytune-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Keytune-*-macos-arm64.zip
